<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Habit Tracker</title>
<style>
:root{--bg:#0e1316;--p:#151c21;--l:#25313a;--t:#e8eef2;--m:#8697a3;--g:#3ddc97;--r:#ff7a7a;--a:#ffc857}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--l)}
h1{font-size:18px;margin:0}main{padding:14px 16px;max-width:1200px;margin:auto}
button,input,select{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g)}
.tab.on{background:var(--g);color:#06231a;border-color:var(--g);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:14px;margin-bottom:14px}
.top{display:grid;grid-template-columns:200px 1fr 1fr;gap:14px}
@media(max-width:800px){.top{grid-template-columns:1fr}}
.ring{width:150px;height:150px;border-radius:50%;margin:6px auto;display:grid;place-items:center}
.ring div{width:106px;height:106px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-size:26px;font-weight:700}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--l)}.kv:last-child{border:0}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px}.chart i{flex:1;background:var(--g);border-radius:3px 3px 0 0;min-height:2px}
.wk{display:flex;align-items:flex-end;gap:14px;height:120px}.wk div{flex:1;text-align:center;font-size:12px;color:var(--m)}
.wk b{display:block;background:var(--a);border-radius:4px 4px 0 0;min-height:2px;margin-bottom:4px}
.tw{overflow-x:auto}table{border-collapse:collapse}th,td{padding:2px;text-align:center}
th{font-weight:400;color:var(--m);font-size:11px;min-width:30px}th b{display:block;color:var(--t);font-size:12px}
th.sun b{color:var(--a)}th.today b{color:var(--g);text-decoration:underline}
.hn{text-align:left;position:sticky;left:0;background:var(--p);padding-right:10px;white-space:nowrap;min-width:150px}.hn i{color:var(--m);font-size:11px;font-style:normal}
.c{width:28px;height:28px;padding:0;border-radius:6px;font-size:12px;background:var(--bg)}
.c.g{background:#12432f;color:var(--g);border-color:#1d6b4b}.c.b{background:#4a1f22;color:var(--r);border-color:#7a3236}.c.z{background:#2a3138;color:var(--m)}.c.o{background:#33290f;color:var(--a);border-color:#6b5517}
.c:disabled{opacity:.3;cursor:default}.dp td{font-size:10px;color:var(--m);padding-top:6px}
.rk{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:5px 0}.rk span:nth-child(2){height:8px;background:var(--l);border-radius:4px;overflow:hidden}.rk em{display:block;height:100%;background:var(--g)}
.accs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.bal{font-size:26px;font-weight:700}.pos{color:var(--g)}.neg{color:var(--r)}
.ent{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--l)}.ent small{color:var(--m)}
.x{padding:0 7px;color:var(--m)}.m{color:var(--m);font-size:12px}
</style></head><body>
<header><h1>My Habit Tracker</h1>
<div class="bar"><button class="tab" data-t="h">Habits</button><button class="tab" data-t="f">Money</button>
<button id="ex">Backup</button><button id="im">Restore</button><input type="file" id="fi" accept=".json" hidden></div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('ht1'))}catch(e){}
S=S||{days:{},acc:{orig:{bf:2070,e:[]},mmm:{bf:-800000,e:[]},papa:{bf:0,e:[]}}};
const save=()=>{try{localStorage.setItem('ht1',JSON.stringify(S))}catch(e){}};
const H=[['fajr','Fajr namaz',[2],['Done']],['zohar','Zohar + Asr',[2],['Done']],['magh','Maghrib + Isha',[2],['Done']],
['nomast','No masturbation',[2],['Done']],['brush','Brush',[2],['Done']],['face','Face wash',[1],['Done']],['water','Water intake',[2],['Done']],
['study','Self study',[3,0],['Done','Switched off today']],['school','School time',[1,-1],['On time','Late']],
['insta','Instagram',[2,1,-2],['Under 3 hours','3 to 4 hours','Over 4 hours']],['gym','Gym',[2],['Done']],
['sleep','Sleep time',[2,1,0,-1],['12 or earlier','1am','2am','3am or later']]];
const AN={orig:'Original',mmm:'Triple M',papa:'Papa'};
const now=new Date();let Y=now.getFullYear(),M=now.getMonth(),tab='h';
const key=(d)=>`${Y}-${String(M+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const dim=()=>new Date(Y,M+1,0).getDate();
const last=()=>(Y==now.getFullYear()&&M==now.getMonth())?now.getDate():(new Date(Y,M)>now?0:dim());
const mx=h=>Math.max(...h[2]);
const hol=d=>!!(S.hol||{})[key(d)],wk0=d=>[0,6].includes(new Date(Y,M,d).getDay());
function ds(d){if(hol(d))return{p:0,m:0,pct:0,hol:1};let p=0,m=0;const v=S.days[key(d)]||{},sun=new Date(Y,M,d).getDay()==0;
 for(const h of H){const x=v[h[0]]|0;
  if(h[0]=='school'&&wk0(d))continue;
  if(h[0]=='study'&&x==2)continue;
  if(h[0]=='gym'&&sun){if(x){p++;m++}continue}
  p+=x?h[2][x-1]:0;m+=mx(h)}
 return{p,m,pct:m?p/m:0}}
const pc=n=>Math.round(Math.max(0,n)*100)+'%';
function cell(h,d){const x=(S.days[key(d)]||{})[h[0]]|0,sun=new Date(Y,M,d).getDay()==0;
 let t='',c='';if(x){const p=h[2][x-1];t=p;c=p>0?'g':p<0?'b':'z';
  if(h[0]=='study'&&x==2){t='off';c='o'}
  if(h[0]=='gym'&&sun){t='+1';c='g'}}
 const dis=hol(d)||(h[0]=='school'&&wk0(d));
 return`<td><button class="c ${c}" ${dis?'disabled':''} data-h="${h[0]}" data-d="${d}" title="${x?h[3][x-1]:h[1]}" aria-label="${h[1]} day ${d}">${t}</button></td>`}
function habits(){const L=dim(),E=last();let P=0,Mx=0,best=0,streak=0,days=[];
 for(let d=1;d<=E;d++){const s=ds(d);P+=s.p;Mx+=s.m;best=Math.max(best,s.p);days.push(s)}
 for(let d=E-1;d>=0;d--){if(days[d].hol)continue;if(days[d].pct>=.7)streak++;else break}
 const tot=Mx?P/Mx:0,mn=new Date(Y,M).toLocaleString('en',{month:'long',year:'numeric'});
 let wk='';for(let w=0;w<5&&w*7<L;w++){const a=days.slice(w*7,w*7+7);const p=a.reduce((s,x)=>s+x.p,0),m=a.reduce((s,x)=>s+x.m,0);
  wk+=`<div><b style="height:${m?Math.max(0,p/m)*90:0}px"></b>${m?pc(p/m):'-'}<br>Week ${w+1}</div>`}
 const rk=H.map(h=>{let p=0,m=0;for(let d=1;d<=E;d++){const sun=new Date(Y,M,d).getDay()==0,x=((S.days[key(d)]||{})[h[0]])|0;if(hol(d)||(h[0]=='school'&&wk0(d)))continue;
   if(h[0]=='study'&&x==2)continue;if(h[0]=='gym'&&sun)continue;p+=x?h[2][x-1]:0;m+=mx(h)}
  return[h[1],m?Math.max(0,p/m):0]}).sort((a,b)=>b[1]-a[1]).map(r=>`<div class="rk"><span>${r[0]}</span><span><em style="width:${r[1]*100}%"></em></span><span>${pc(r[1])}</span></div>`).join('');
 let th='',rows='',ft='';
 for(let d=1;d<=L;d++){const dt=new Date(Y,M,d);th+=`<th class="${dt.getDay()==0?'sun':''} ${d==now.getDate()&&E&&Y==now.getFullYear()&&M==now.getMonth()?'today':''}">${'SMTWTFS'[dt.getDay()]}<b>${d}</b></th>`;
  ft+=`<td>${d<=E?(days[d-1].hol?'off':pc(days[d-1].pct)):''}</td>`}
 rows+=`<tr><td class="hn">Holiday <i>day not counted</i></td>${Array.from({length:L},(_,i)=>`<td><button class="c ${hol(i+1)?'o':''}" data-hol="${i+1}" aria-label="Holiday, day ${i+1}">${hol(i+1)?'H':''}</button></td>`).join('')}</tr>`;
 for(const h of H){rows+=`<tr><td class="hn">${h[1]} <i>max ${mx(h)}</i></td>`;for(let d=1;d<=L;d++)rows+=cell(h,d);rows+='</tr>'}
 return`<div class="bar" style="margin-bottom:12px"><button id="pv">&lt;</button><b style="min-width:150px;text-align:center">${mn}</b><button id="nx">&gt;</button></div>
 <div class="top"><div class="box"><div class="ring" style="background:conic-gradient(var(--g) ${Math.max(0,tot)*360}deg,var(--l) 0)"><div>${pc(tot)}</div></div><div class="m" style="text-align:center">Month so far</div></div>
 <div class="box"><div class="kv"><span>Points earned</span><b>${P}</b></div><div class="kv"><span>Points possible</span><b>${Mx}</b></div><div class="kv"><span>Best day</span><b>${best} pts</b></div><div class="kv"><span>Streak (days at 70%+)</span><b>${streak}</b></div></div>
 <div class="box"><div class="m" style="margin-bottom:6px">Weekly progress</div><div class="wk">${wk}</div></div></div>
 <div class="box"><div class="m" style="margin-bottom:6px">Daily progress</div><div class="chart">${days.map(s=>`<i style="height:${s.hol?2:Math.max(0,s.pct)*100}%${s.hol?';background:var(--l)':''}"></i>`).join('')}</div></div>
 <div class="box"><div class="m" style="margin-bottom:8px">Tap a box to log it. Tap again to change: Instagram, school and sleep cycle through their options. Self study cycles done, off, empty. The Holiday row removes a whole day from every score. School is not counted on Saturday and Sunday.</div>
 <div class="tw"><table><thead><tr><th></th>${th}</tr></thead><tbody>${rows}<tr class="dp"><td class="hn">Day score</td>${ft}</tr></tbody></table></div></div>
 <div class="box"><div class="m" style="margin-bottom:6px">Habits ranked by score this month</div>${rk}</div>`}
const f=n=>n.toLocaleString('en-IN');
function money(){const o=Object.keys(AN).map(k=>{const a=S.acc[k],b=a.bf+a.e.reduce((s,e)=>s+(e.t=='in'?e.a:-e.a),0);
 return`<div class="box"><b>${AN[k]}</b><div class="bal ${b<0?'neg':'pos'}">Rs ${f(b)}</div>
 <div class="m">Brought forward: <input type="number" data-bf="${k}" value="${a.bf}" style="width:120px"></div><div style="margin-top:8px">
 ${a.e.slice().sort((x,y)=>y.d.localeCompare(x.d)).map(e=>`<div class="ent"><span>${e.n||'Entry'}<br><small>${e.d}</small></span><span class="${e.t=='in'?'pos':'neg'}">${e.t=='in'?'+':'-'}${f(e.a)} <button class="x" data-del="${k}" data-id="${e.id}" aria-label="Delete entry">x</button></span></div>`).join('')||'<div class="m">No entries yet.</div>'}</div></div>`}).join('');
 return`<form class="box bar" id="ff"><select id="fa">${Object.keys(AN).map(k=>`<option value="${k}">${AN[k]}</option>`).join('')}</select>
 <input type="date" id="fd" value="${new Date().toISOString().slice(0,10)}"><select id="ft"><option value="in">Money in</option><option value="out">Money out</option></select>
 <input type="number" id="fm" placeholder="Amount" min="0" step="any" required style="width:120px"><input id="fn" placeholder="What was it for?" style="flex:1;min-width:160px"><button class="tab on">Add entry</button></form><div class="accs">${o}</div>`}
function render(){const sl=($('.tw')||{}).scrollLeft||0;$('#app').innerHTML=tab=='h'?habits():money();
 document.querySelectorAll('.tab[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));const t=$('.tw');if(t)t.scrollLeft=sl}
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.t){tab=t.dataset.t;render()}
 else if(t.dataset.h){const h=H.find(x=>x[0]==t.dataset.h),k=key(+t.dataset.d);S.days[k]=S.days[k]||{};S.days[k][h[0]]=((S.days[k][h[0]]|0)+1)%(h[2].length+1);save();render()}
 else if(t.dataset.hol){const k=key(+t.dataset.hol);S.hol=S.hol||{};if(S.hol[k])delete S.hol[k];else S.hol[k]=1;save();render()}
 else if(t.id=='pv'||t.id=='nx'){M+=t.id=='pv'?-1:1;if(M<0){M=11;Y--}if(M>11){M=0;Y++}render()}
 else if(t.dataset.del){const a=S.acc[t.dataset.del];a.e=a.e.filter(x=>x.id!=t.dataset.id);save();render()}
 else if(t.id=='ex'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='habit-backup.json';a.click()}
 else if(t.id=='im')$('#fi').click()});
document.addEventListener('submit',e=>{e.preventDefault();const a=+$('#fm').value;if(!a)return;
 S.acc[$('#fa').value].e.push({id:Date.now(),d:$('#fd').value,t:$('#ft').value,a,n:$('#fn').value});save();render()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.bf){S.acc[t.dataset.bf].bf=+t.value||0;save();render()}
 else if(t.id=='fi'){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render()}catch(x){alert('This file is not a valid backup.')}};r.readAsText(t.files[0])}});
render();
</script></body></html>
